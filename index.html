<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>5T Services / Shop / Socials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0b0b0f; /* deep black */
      --card:#17171c; /* card bg */
      --muted:#2a2a33; /* table header */
      --text:#e9e9f1; /* primary text */
      --sub:#9aa0a6;  /* secondary text */
      --ring: #8b5cf6; /* purple */
      --shadow: 0 10px 30px rgba(0,0,0,.4);
      --radius: 14px;
    }

    *{ box-sizing:border-box }
    html,body{ height:100% }
    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      color:var(--text);
      background: var(--bg);
      display:grid;
      place-items:center;
      overflow-x:hidden;
    }

    /* Subtle grid + diagonal watermark (repeats) */
    body::before{
      content:"";
      position:fixed; inset:0;
      background:
        /* light grid */
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        /* repeating SVG watermark with the two texts */
        url("data:image/svg+xml;utf8,\
        <svg xmlns='http://www.w3.org/2000/svg' width='520' height='260'>\
          <g transform='rotate(-18 260 130)' fill='white' fill-opacity='.035' font-family='Poppins, Inter, Arial' font-size='28' font-weight='800'>\
            <text x='40'  y='100'>5T Services/Shop · 5T Services/Shop · 5T Services/Shop</text>\
            <text x='10'  y='190'>discord.gg/5tshop · discord.gg/5tshop · discord.gg/5tshop</text>\
          </g>\
        </svg>");
      background-position: 0 0, 0 0, 0 0;
      background-repeat: repeat, repeat, repeat;
      pointer-events:none;
      z-index:0;
    }

    
    body::after{
      content:"discord.gg/5tshop";
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      pointer-events:none; z-index:0;
      font-family:Poppins, Inter, system-ui, Arial; font-weight:800;
      font-size: clamp(28px, 7vw, 86px);
      color: rgba(255,255,255,.07);
      letter-spacing:.8px;
      transform: rotate(-8deg);
      text-shadow: 0 6px 30px rgba(0,0,0,.45);
    }
.wrap{ width:min(920px, 92vw); padding:36px 18px; position:relative; z-index:1; }

    .brand-chip{
      display:inline-flex; align-items:center; gap:10px;
      padding:10px 16px; border-radius:999px;
      background:linear-gradient(180deg, rgba(139,92,246,.2), rgba(139,92,246,.08));
      border:1px solid rgba(139,92,246,.35);
      box-shadow: var(--shadow);
      font-weight:700; letter-spacing:.3px;
    }
    .brand-chip .dot{width:8px;height:8px;border-radius:999px;background:#22c55e; box-shadow: 0 0 12px #22c55e;height:8px;border-radius:999px;background:#22c55e; box-shadow:0 0 12px #22c55e}

    h1{
      font-family:Poppins, Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      font-weight:800; text-align:center; margin:28px 0 18px; font-size: clamp(28px, 4vw, 44px);
      letter-spacing:.3px;
    }
    h1 .emoji{ filter: drop-shadow(0 6px 10px rgba(139,92,246,.35)); }
    .subtitle{ text-align:center; color:var(--sub); margin-top:6px; }

    .card{
      margin:28px auto 22px; width:min(720px, 100%);
      border-radius: var(--radius);
      background:var(--card);
      box-shadow: var(--shadow);
      overflow:hidden; border:1px solid rgba(255,255,255,.06);
    }

    .thead{
      display:grid; grid-template-columns: 1.2fr .8fr; gap:0; align-items:center;
      background:var(--muted);
      padding:14px 18px; font-weight:800; letter-spacing:.4px; color:#c9c9d6; text-transform:uppercase; font-size:12px;
    }

    .row{ display:grid; grid-template-columns: 1.2fr .8fr; gap:0; align-items:center; padding:18px; border-top:1px solid rgba(255,255,255,.06); }
    .row .left{ display:flex; align-items:center; gap:12px; font-weight:700; }
    .row .left .icon{ font-size:22px; }

    /* Fancy animated gradient link/button */
    .action{
      justify-self:end; position:relative; display:inline-flex; align-items:center; gap:10px;
      font-weight:800; padding:12px 18px; border-radius:12px; text-decoration:none; color:var(--text);
      border:1px solid rgba(255,255,255,.09);
      background: rgba(255,255,255,.03);
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    .action:hover{ transform: translateY(-1px); border-color: rgba(139,92,246,.45); }

    .gtext{ /* animated gradient text */
      background: linear-gradient(90deg,#a78bfa,#34d399,#f472b6,#60a5fa,#f59e0b,#a78bfa);
      background-size: 300% 100%;
      -webkit-background-clip:text; background-clip:text; color:transparent;
      animation: flow 4.5s linear infinite;
      letter-spacing:.2px;
    }
    .gtext.alt{ background: linear-gradient(90deg,#22c55e,#ef4444,#f59e0b,#3b82f6,#22c55e); }
    @keyframes flow{ 0%{background-position:0% 0} 100%{background-position:100% 0} }

    .pill{
      display:inline-flex; align-items:center; gap:8px; font-size:12px; padding:6px 10px; border-radius:999px;
      background:rgba(255,255,255,.06); color:#d7d7e6; border:1px solid rgba(255,255,255,.08);
    }

    .footer{ text-align:center; margin-top:18px; color:var(--sub); font-size:13px; }
    .footer a{ color:#bdbdf5; text-decoration:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand-chip" aria-label="site badge">
      <span class="dot" style="background:#22c55e;box-shadow:0 0 12px #22c55e"></span>
      <span>5T Services · Shop</span>
    </div>

    <h1>✨ Enter our social media pages! <span class="emoji">🔗</span></h1>
    <p class="subtitle">Find us on Discord and our website — stay updated with the latest from <strong>5T</strong> 🚀</p>

    <section class="card" role="table" aria-label="Social Links">
      <div class="thead" role="row">
        <div>Platform</div>
        <div style="text-align:right">Action</div>
      </div>

      <!-- Row 1: Discord -->
      <div class="row" role="row">
        <div class="left" role="cell">
          <span class="icon">💬</span>
          <div>
            <div style="font-weight:800">Discord Server</div>
          </div>
        </div>
        <a class="action" role="cell" href="https://discord.gg/EuypGgkSRn" target="_blank" rel="noopener noreferrer" aria-label="Join our Discord">
          <span class="gtext" style="font-weight:900">Enter our Discord</span> ➜
        </a>
      </div>

      <!-- Row 2: Website -->
      <div class="row" role="row">
        <div class="left" role="cell">
          <span class="icon">🌐</span>
          <div>
            <div style="font-weight:800">Website</div>
          </div>
        </div>
        <a class="action" role="cell" href="https://5t.mysellauth.com/" target="_blank" rel="noopener noreferrer" aria-label="Open website">
          <span class="gtext" style="font-weight:900">Enter our Website!</span> ➜
        </a>
      </div>
    </section>

    <div class="footer">
      <strong>5T Services/Shop</strong> · <code>discord.gg/5tshop</code> ✨
    </div>
  </div>
</body>
</html>
